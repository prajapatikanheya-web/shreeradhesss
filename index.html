<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>श्री राधे स्वयं सहायता समूह</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        width: 100%;
    }

    h1 {
        color: #fff;
        margin-bottom: 30px;
        font-size: 22px;
    }

    .btn {
        display: block;
        width: 80%;
        max-width: 300px;
        margin: 12px auto;
        padding: 14px;
        font-size: 18px;
        border-radius: 8px;
        color: white;
        text-decoration: none;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }

    .admin {
        background: #ff4b2b;
    }

    .loan {
        background: #28a745;
    }
</style>
</head>

<body>

<div class="container">
    <h1>श्री राधे स्वयं सहायता समूह</h1>

    <button class="btn admin" onclick="loginRedirect('admin')">Admin</button>
    <button class="btn loan" onclick="loginRedirect('loan')">Loan</button>
</div>

<script>
    function loginRedirect(type) {
        var user = prompt("Enter ID:");
        var pass = prompt("Enter Password:");

        if(user === "admin" && pass === "1234") {
            if(type === 'admin'){
                window.location.href = "https://m8079000715.github.io/sssnamana/admin";
            } else {
                window.location.href = "https://m8079000715.github.io/sssnamana/loan";
            }
        } else {
            alert("Wrong ID or Password");
        }
    }
</script>

</body>
</html>
