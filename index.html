<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>श्री राधे स्वयं सहायता समूह</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#4facfe,#00f2fe);
  color:#333;
  max-width:500px;
  margin:auto;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#1d2b64,#f8cdda);
  padding:15px;
  text-align:center;
  color:white;
  font-weight:bold;
  font-size:18px;
  position:relative;
}

/* MENU BUTTON */
.menu-btn{
  position:absolute;
  left:10px;
  top:15px;
  font-size:22px;
  cursor:pointer;
}

/* SLIDE MENU */
.sidebar{
  position:fixed;
  left:-250px;
  top:0;
  width:250px;
  height:100%;
  background:#fff;
  box-shadow:2px 0 10px rgba(0,0,0,0.2);
  transition:0.3s;
  padding-top:60px;
  z-index:999;
}

.sidebar a{
  display:block;
  padding:15px;
  text-decoration:none;
  color:#333;
  font-weight:500;
  border-bottom:1px solid #eee;
}

.sidebar a:hover{
  background:#f2f2f2;
}

/* MAIN BUTTON */
.main-btn{
  margin:40px 20px;
  padding:20px;
  font-size:18px;
  border:none;
  border-radius:12px;
  width:calc(100% - 40px);
  background:linear-gradient(135deg,#ff7e5f,#feb47b);
  color:white;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  transition:0.3s;
}

.main-btn:active{
  transform:scale(0.97);
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
}
</style>

</head>

<body>

<div class="header">
  <span class="menu-btn" onclick="openMenu()">☰</span>
  श्री राधे स्वयं सहायता समूह
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <a href="https://kpnamana.online/admin"_blank">ADD DATA</a>
  <a href="https://kpnamana.online/loan" target="_blank">LOAN</a>
  <a href="https://kpnamana.online/dash" target="_blank">DASHBOARD</a>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- MAIN BUTTON -->
<button class="main-btn" onclick="window.open('https://google.com','_blank')">
  🔍 डाटा खोजे
</button>

<script>
function openMenu(){
  document.getElementById("sidebar").style.left="0";
  document.getElementById("overlay").style.display="block";
}

function closeMenu(){
  document.getElementById("sidebar").style.left="-250px";
  document.getElementById("overlay").style.display="none";
}
</script>

</body>
</html>
